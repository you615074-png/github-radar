name: daily-radar

on:
  schedule:
    # 主触发不靠这里：外部定时服务每天 UTC 10:30 左右（北京 18:30，太平洋凌晨）准点调用 workflow_dispatch，
    # 并带上 skip_if_done=true。下面是补跑：GitHub 自带的定时任务实测会晚 7-8 小时、而且大部分会被丢掉，
    # 只用来在主触发失败时兜底。开不开跑由 radar/offpeak.py 决定：只在 DeepSeek 谷时，且这一期还没生成。
    - cron: "7 10-15 * * *"
  workflow_dispatch:
    inputs:
      skip_if_done:
        description: "这一期已生成就跳过（外部定时触发时用）"
        type: boolean
        default: false
      dry_run:
        description: "只跑流程，不发邮件"
        type: boolean
        default: false
      limit:
        description: "最多打分多少个（留空为默认 40）"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 检查是否在 DeepSeek 谷时
        id: gate
        env:
          SKIP: ${{ github.event_name == 'schedule' || inputs.skip_if_done }}
        run: python radar/offpeak.py $([ "$SKIP" = "true" ] && echo --skip-if-done)

      - name: 安装依赖
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 运行雷达
        if: steps.gate.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          X_HANDLE: ${{ vars.X_HANDLE }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          EVENT: ${{ github.event_name }}
          SKIP_IF_DONE: ${{ inputs.skip_if_done }}
        run: |
          args=""
          if [ "$EVENT" = "schedule" ] || [ "$SKIP_IF_DONE" = "true" ]; then args="$args --skip-if-done"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then args="$args --limit $LIMIT"; fi
          python -m radar.main $args

      - name: 提交数据和网站
        if: (success() || failure()) && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-radar[bot]"
          git config user.email "github-radar[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet && exit 0
          git commit -m "radar: $(python radar/offpeak.py --print-date)"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: radar
    if: needs.radar.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
