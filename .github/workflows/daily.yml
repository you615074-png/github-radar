name: daily-radar

on:
  schedule:
    # GitHub 定时任务实测会延迟 2-3 小时，所以设两个触发点：北京时间 02:17 和 04:17（UTC 18:17、20:17）。
    # 第一个成功后，第二个会自动跳过；第一个失败或没触发，第二个补上。
    # 两个时间点即使延迟 3 小时也在 8 点前，且都在 DeepSeek 谷时（峰时是工作日北京时间 09-12、14-18 点）。
    - cron: "17 18 * * *"
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑流程，不发邮件"
        type: boolean
        default: false
      limit:
        description: "最多打分多少个（留空为默认 40）"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 运行雷达
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          EVENT: ${{ github.event_name }}
        run: |
          args=""
          if [ "$EVENT" = "schedule" ]; then args="$args --skip-if-done"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then args="$args --limit $LIMIT"; fi
          python -m radar.main $args

      - name: 提交数据和网站
        if: success() || failure()
        run: |
          git config user.name "github-radar[bot]"
          git config user.email "github-radar[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet && exit 0
          git commit -m "radar: $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: radar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
