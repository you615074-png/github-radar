name: daily-radar

on:
  schedule:
    # GitHub 定时任务实测会延迟 6-10 小时，而且不稳定，所以每小时都触发一次（UTC 00-14 点）。
    # 真正开不开跑由 radar/offpeak.py 决定：只在 DeepSeek 谷时、且在北京 08:00-23:00（UTC 00-15 点）之间开跑，
    # 当天日报已生成就跳过。跳过的那次只花半分钟，不装依赖、不调模型。
    # 这样无论延迟多久，日报都在谷时生成，并在太平洋时间早上 7 点前送达。
    - cron: "7 0-14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑流程，不发邮件"
        type: boolean
        default: false
      limit:
        description: "最多打分多少个（留空为默认 40）"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 检查是否在 DeepSeek 谷时
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: python radar/offpeak.py --event "$EVENT"

      - name: 安装依赖
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 运行雷达
        if: steps.gate.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          X_HANDLE: ${{ vars.X_HANDLE }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          EVENT: ${{ github.event_name }}
        run: |
          args=""
          if [ "$EVENT" = "schedule" ]; then args="$args --skip-if-done"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then args="$args --limit $LIMIT"; fi
          python -m radar.main $args

      - name: 提交数据和网站
        if: (success() || failure()) && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-radar[bot]"
          git config user.email "github-radar[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet && exit 0
          git commit -m "radar: $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: radar
    if: needs.radar.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
