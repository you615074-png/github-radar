name: daily-radar

on:
  schedule:
    # 北京时间 06:17（UTC 22:17）。DeepSeek 峰时是北京时间工作日 09-12 点和 14-18 点，
    # 这个时间点在谷时（半价），即使 GitHub 定时任务延迟一两个小时也来得及。
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑流程，不发邮件"
        type: boolean
        default: false
      limit:
        description: "最多打分多少个（留空为默认 40）"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 运行雷达
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then args="$args --limit $LIMIT"; fi
          python -m radar.main $args

      - name: 提交数据和网站
        if: success() || failure()
        run: |
          git config user.name "github-radar[bot]"
          git config user.email "github-radar[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet && exit 0
          git commit -m "radar: $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: radar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
